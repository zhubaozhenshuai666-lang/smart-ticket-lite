spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SMART_TICKET_DB_URL:jdbc:mysql://localhost:3306/smart_ticket_lite?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
    username: ${SMART_TICKET_DB_USERNAME:root}
    password: ${SMART_TICKET_DB_PASSWORD:}
    hikari:
      pool-name: SmartTicketLiteHikariCP
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${SMART_TICKET_REDIS_HOST:localhost}
      port: ${SMART_TICKET_REDIS_PORT:6379}
      database: ${SMART_TICKET_REDIS_DATABASE:0}
      password: ${SMART_TICKET_REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.apache.ibatis: WARN
    com.zaxxer.hikari: INFO
    com.zewbby.smartticket: INFO

smart-ticket:
  jwt:
    secret: ${SMART_TICKET_JWT_SECRET:smart-ticket-dev-secret-at-least-32-bytes}
    expire-minutes: ${SMART_TICKET_JWT_EXPIRE_MINUTES:120}
  auth:
    login-fail-threshold: ${SMART_TICKET_LOGIN_FAIL_THRESHOLD:5}
    login-lock-minutes: ${SMART_TICKET_LOGIN_LOCK_MINUTES:10}
