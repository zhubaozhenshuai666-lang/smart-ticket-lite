spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SMART_TICKET_DB_URL:jdbc:mysql://localhost:3306/smart_ticket_lite?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
    username: ${SMART_TICKET_DB_USERNAME:root}
    password: ${SMART_TICKET_DB_PASSWORD:}
    hikari:
      pool-name: SmartTicketLiteHikariCP
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${SMART_TICKET_REDIS_HOST:localhost}
      port: ${SMART_TICKET_REDIS_PORT:6379}
      database: ${SMART_TICKET_REDIS_DATABASE:0}
      password: ${SMART_TICKET_REDIS_PASSWORD:}

  rabbitmq:
    host: ${SMART_TICKET_RABBITMQ_HOST:localhost}
    port: ${SMART_TICKET_RABBITMQ_PORT:5672}
    username: ${SMART_TICKET_RABBITMQ_USERNAME:guest}
    password: ${SMART_TICKET_RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
