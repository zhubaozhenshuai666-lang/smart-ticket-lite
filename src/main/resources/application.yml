server:
  port: 8081

spring:
  application:
    name: smart-ticket-lite

  profiles:
    active: local

  kafka:
    bootstrap-servers: ${SMART_TICKET_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: ${SMART_TICKET_KAFKA_PRODUCER_ACKS:all}
      retries: ${SMART_TICKET_KAFKA_PRODUCER_RETRIES:3}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: ${SMART_TICKET_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.zewbby.smartticket.mq
        spring.json.value.default.type: com.zewbby.smartticket.mq.AsyncCreateOrderMessage

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zewbby.smartticket.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

smart-ticket:
  jwt:
    secret: ${SMART_TICKET_JWT_SECRET:smart-ticket-dev-secret-at-least-32-bytes}
    expire-minutes: ${SMART_TICKET_JWT_EXPIRE_MINUTES:120}
  auth:
    login-fail-threshold: ${SMART_TICKET_LOGIN_FAIL_THRESHOLD:5}
    login-lock-minutes: ${SMART_TICKET_LOGIN_LOCK_MINUTES:10}
  local-message:
    sender-enabled: ${SMART_TICKET_LOCAL_MESSAGE_SENDER_ENABLED:true}
    batch-size: ${SMART_TICKET_LOCAL_MESSAGE_BATCH_SIZE:100}
    confirm-timeout-seconds: ${SMART_TICKET_LOCAL_MESSAGE_CONFIRM_TIMEOUT_SECONDS:60}
    default-max-retry-count: ${SMART_TICKET_LOCAL_MESSAGE_MAX_RETRY_COUNT:5}
    mark-sent-enabled: ${SMART_TICKET_LOCAL_MESSAGE_MARK_SENT_ENABLED:false}
  async-order-submit:
    persist-request-before-publish: ${SMART_TICKET_ASYNC_ORDER_PERSIST_REQUEST_BEFORE_PUBLISH:false}
    publisher-mode: ${SMART_TICKET_ASYNC_ORDER_PUBLISHER_MODE:kafka}
    in-flight-control-enabled: ${SMART_TICKET_ASYNC_ORDER_IN_FLIGHT_CONTROL_ENABLED:true}
    max-in-flight-per-ticket-category: ${SMART_TICKET_ASYNC_ORDER_MAX_IN_FLIGHT_PER_TICKET_CATEGORY:20000}
    in-flight-counter-ttl-seconds: ${SMART_TICKET_ASYNC_ORDER_IN_FLIGHT_COUNTER_TTL_SECONDS:600}
    redis-stream-name: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_NAME:stream:order:async:create}
    redis-stream-consumer-group: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_CONSUMER_GROUP:order-create-consumers}
    redis-stream-consumer-name: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_CONSUMER_NAME:${spring.application.name}-${server.port}}
    redis-stream-read-batch-size: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_READ_BATCH_SIZE:64}
    redis-stream-poll-fixed-delay-millis: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_POLL_FIXED_DELAY_MILLIS:50}
    redis-stream-block-millis: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_BLOCK_MILLIS:100}
    redis-stream-worker-threads: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_WORKER_THREADS:1}
    kafka-async-create-order-topic: ${SMART_TICKET_ASYNC_ORDER_KAFKA_TOPIC:smart-ticket.async-order.create}
    kafka-async-create-order-dead-letter-topic: ${SMART_TICKET_ASYNC_ORDER_KAFKA_DLT_TOPIC:smart-ticket.async-order.create.DLT}
    kafka-async-create-order-consumer-group: ${SMART_TICKET_ASYNC_ORDER_KAFKA_CONSUMER_GROUP:smart-ticket-async-order-create}
  mq-consumer:
    max-retry-count: ${SMART_TICKET_MQ_CONSUMER_MAX_RETRY_COUNT:3}
    retry-interval-seconds: ${SMART_TICKET_MQ_CONSUMER_RETRY_INTERVAL_SECONDS:10}
    processing-timeout-seconds: ${SMART_TICKET_MQ_CONSUMER_PROCESSING_TIMEOUT_SECONDS:120}
    concurrent-consumers: ${SMART_TICKET_MQ_CONSUMER_CONCURRENT_CONSUMERS:16}
    max-concurrent-consumers: ${SMART_TICKET_MQ_CONSUMER_MAX_CONCURRENT_CONSUMERS:64}
    prefetch-count: ${SMART_TICKET_MQ_CONSUMER_PREFETCH_COUNT:20}
    async-queue-shard-count: ${SMART_TICKET_MQ_CONSUMER_ASYNC_QUEUE_SHARD_COUNT:32}
    max-concurrent-consumer-cap: ${SMART_TICKET_MQ_CONSUMER_MAX_CONCURRENT_CONSUMER_CAP:128}
    max-prefetch-count: ${SMART_TICKET_MQ_CONSUMER_MAX_PREFETCH_COUNT:50}
    max-unacked-messages: ${SMART_TICKET_MQ_CONSUMER_MAX_UNACKED_MESSAGES:1000}
    max-async-queue-shard-count: ${SMART_TICKET_MQ_CONSUMER_MAX_ASYNC_QUEUE_SHARD_COUNT:64}
  order-timeout:
    delay-message-enabled: ${SMART_TICKET_ORDER_TIMEOUT_DELAY_MESSAGE_ENABLED:false}
    publisher-mode: ${SMART_TICKET_ORDER_TIMEOUT_PUBLISHER_MODE:kafka}
    scan-batch-size: ${SMART_TICKET_ORDER_TIMEOUT_SCAN_BATCH_SIZE:5000}
    scan-fixed-delay-millis: ${SMART_TICKET_ORDER_TIMEOUT_SCAN_FIXED_DELAY_MILLIS:500}
    kafka-order-timeout-topic: ${SMART_TICKET_ORDER_TIMEOUT_KAFKA_TOPIC:smart-ticket.order.timeout}
    kafka-order-timeout-consumer-group: ${SMART_TICKET_ORDER_TIMEOUT_KAFKA_CONSUMER_GROUP:smart-ticket-order-timeout}
  stock-consistency:
    enabled: ${SMART_TICKET_STOCK_CONSISTENCY_ENABLED:false}
    fixed-delay-seconds: ${SMART_TICKET_STOCK_CONSISTENCY_FIXED_DELAY_SECONDS:300}
    batch-size: ${SMART_TICKET_STOCK_CONSISTENCY_BATCH_SIZE:100}
    auto-repair-enabled: ${SMART_TICKET_STOCK_CONSISTENCY_AUTO_REPAIR_ENABLED:false}
  stock-bucket:
    enabled: ${SMART_TICKET_STOCK_BUCKET_ENABLED:true}
    default-bucket-count: ${SMART_TICKET_STOCK_BUCKET_DEFAULT_COUNT:32}
    active-version: ${SMART_TICKET_STOCK_BUCKET_ACTIVE_VERSION:1}
    active-probe-count: ${SMART_TICKET_STOCK_BUCKET_ACTIVE_PROBE_COUNT:3}
    tail-bucket-count: ${SMART_TICKET_STOCK_BUCKET_TAIL_BUCKET_COUNT:4}
    porter-enabled: ${SMART_TICKET_STOCK_BUCKET_PORTER_ENABLED:false}
    porter-source-version: ${SMART_TICKET_STOCK_BUCKET_PORTER_SOURCE_VERSION:1}
    porter-max-move-quantity-per-run: ${SMART_TICKET_STOCK_BUCKET_PORTER_MAX_MOVE_QUANTITY_PER_RUN:1000}
    porter-batch-size: ${SMART_TICKET_STOCK_BUCKET_PORTER_BATCH_SIZE:100}
    porter-lock-ttl-seconds: ${SMART_TICKET_STOCK_BUCKET_PORTER_LOCK_TTL_SECONDS:30}
    porter-move-record-ttl-seconds: ${SMART_TICKET_STOCK_BUCKET_PORTER_MOVE_RECORD_TTL_SECONDS:86400}
    porter-fixed-delay-seconds: ${SMART_TICKET_STOCK_BUCKET_PORTER_FIXED_DELAY_SECONDS:300}
  waiting-room:
    enabled: ${SMART_TICKET_WAITING_ROOM_ENABLED:false}
    admission-token-expire-seconds: ${SMART_TICKET_WAITING_ROOM_ADMISSION_TOKEN_EXPIRE_SECONDS:120}
    default-admission-token-batch-size: ${SMART_TICKET_WAITING_ROOM_DEFAULT_ADMISSION_TOKEN_BATCH_SIZE:10}
    max-admission-token-batch-size: ${SMART_TICKET_WAITING_ROOM_MAX_ADMISSION_TOKEN_BATCH_SIZE:100}
  activity-isolation:
    enabled: ${SMART_TICKET_ACTIVITY_ISOLATION_ENABLED:true}
    max-in-flight-per-activity-ticket-category: ${SMART_TICKET_ACTIVITY_ISOLATION_MAX_IN_FLIGHT_PER_ACTIVITY_TICKET_CATEGORY:100000}
  risk-control:
    enabled: ${SMART_TICKET_RISK_CONTROL_ENABLED:true}
    max-ip-attempts-per-minute: ${SMART_TICKET_RISK_CONTROL_MAX_IP_ATTEMPTS_PER_MINUTE:600}
    max-user-attempts-per-minute: ${SMART_TICKET_RISK_CONTROL_MAX_USER_ATTEMPTS_PER_MINUTE:60}
    counter-ttl-seconds: ${SMART_TICKET_RISK_CONTROL_COUNTER_TTL_SECONDS:120}
    gateway-decision-enabled: ${SMART_TICKET_RISK_CONTROL_GATEWAY_DECISION_ENABLED:true}
    gateway-decision-header-name: ${SMART_TICKET_RISK_CONTROL_GATEWAY_DECISION_HEADER_NAME:X-Smart-Ticket-Risk-Decision}
    gateway-pass-value: ${SMART_TICKET_RISK_CONTROL_GATEWAY_PASS_VALUE:pass}
    gateway-reject-value: ${SMART_TICKET_RISK_CONTROL_GATEWAY_REJECT_VALUE:reject}
    gateway-decision-required: ${SMART_TICKET_RISK_CONTROL_GATEWAY_DECISION_REQUIRED:false}
    skip-local-counter-when-gateway-pass: ${SMART_TICKET_RISK_CONTROL_SKIP_LOCAL_COUNTER_WHEN_GATEWAY_PASS:false}
  show-relation-cache:
    enabled: ${SMART_TICKET_SHOW_RELATION_CACHE_ENABLED:true}
    fail-closed: ${SMART_TICKET_SHOW_RELATION_CACHE_FAIL_CLOSED:true}
    refresh-fixed-delay-millis: ${SMART_TICKET_SHOW_RELATION_CACHE_REFRESH_FIXED_DELAY_MILLIS:30000}
    lookup-cache-maximum-size: ${SMART_TICKET_SHOW_RELATION_CACHE_LOOKUP_MAXIMUM_SIZE:200000}
  order-snapshot-cache:
    enabled: ${SMART_TICKET_ORDER_SNAPSHOT_CACHE_ENABLED:true}
    fail-closed: ${SMART_TICKET_ORDER_SNAPSHOT_CACHE_FAIL_CLOSED:true}
    refresh-fixed-delay-millis: ${SMART_TICKET_ORDER_SNAPSHOT_CACHE_REFRESH_FIXED_DELAY_MILLIS:30000}
  user-status-cache:
    enabled: ${SMART_TICKET_USER_STATUS_CACHE_ENABLED:true}
    expire-after-write-seconds: ${SMART_TICKET_USER_STATUS_CACHE_EXPIRE_AFTER_WRITE_SECONDS:30}
    maximum-size: ${SMART_TICKET_USER_STATUS_CACHE_MAXIMUM_SIZE:200000}
  show-cache:
    show-detail-ttl-seconds: ${SMART_TICKET_SHOW_CACHE_DETAIL_TTL_SECONDS:1800}
    show-detail-ttl-jitter-seconds: ${SMART_TICKET_SHOW_CACHE_DETAIL_TTL_JITTER_SECONDS:300}
    show-sessions-ttl-seconds: ${SMART_TICKET_SHOW_CACHE_SESSIONS_TTL_SECONDS:600}
    show-sessions-ttl-jitter-seconds: ${SMART_TICKET_SHOW_CACHE_SESSIONS_TTL_JITTER_SECONDS:120}
    session-ticket-categories-ttl-seconds: ${SMART_TICKET_SHOW_CACHE_TICKET_CATEGORIES_TTL_SECONDS:600}
    session-ticket-categories-ttl-jitter-seconds: ${SMART_TICKET_SHOW_CACHE_TICKET_CATEGORIES_TTL_JITTER_SECONDS:120}
    null-ttl-seconds: ${SMART_TICKET_SHOW_CACHE_NULL_TTL_SECONDS:60}
    null-ttl-jitter-seconds: ${SMART_TICKET_SHOW_CACHE_NULL_TTL_JITTER_SECONDS:30}
    lock-ttl-seconds: ${SMART_TICKET_SHOW_CACHE_LOCK_TTL_SECONDS:5}
    lock-retry-sleep-millis: ${SMART_TICKET_SHOW_CACHE_LOCK_RETRY_SLEEP_MILLIS:50}
    lock-retry-times: ${SMART_TICKET_SHOW_CACHE_LOCK_RETRY_TIMES:3}
  rate-limit:
    enabled: ${SMART_TICKET_RATE_LIMIT_ENABLED:true}
    algorithm: ${SMART_TICKET_RATE_LIMIT_ALGORITHM:token-bucket}
    order-user-capacity: ${SMART_TICKET_RATE_LIMIT_ORDER_USER_CAPACITY:5}
    order-user-refill-rate-per-second: ${SMART_TICKET_RATE_LIMIT_ORDER_USER_REFILL_RATE_PER_SECOND:1}
    order-ip-capacity: ${SMART_TICKET_RATE_LIMIT_ORDER_IP_CAPACITY:30}
    order-ip-refill-rate-per-second: ${SMART_TICKET_RATE_LIMIT_ORDER_IP_REFILL_RATE_PER_SECOND:5}
    order-api-capacity: ${SMART_TICKET_RATE_LIMIT_ORDER_API_CAPACITY:500}
    order-api-refill-rate-per-second: ${SMART_TICKET_RATE_LIMIT_ORDER_API_REFILL_RATE_PER_SECOND:100}
    order-ticket-capacity: ${SMART_TICKET_RATE_LIMIT_ORDER_TICKET_CAPACITY:100}
    order-ticket-refill-rate-per-second: ${SMART_TICKET_RATE_LIMIT_ORDER_TICKET_REFILL_RATE_PER_SECOND:20}
    key-ttl-seconds: ${SMART_TICKET_RATE_LIMIT_KEY_TTL_SECONDS:120}
    soldout-ttl-seconds: ${SMART_TICKET_SOLDOUT_TTL_SECONDS:600}
    backpressure-enabled: ${SMART_TICKET_RATE_LIMIT_BACKPRESSURE_ENABLED:false}
    local-message-backlog-reject-threshold: ${SMART_TICKET_RATE_LIMIT_LOCAL_MESSAGE_BACKLOG_REJECT_THRESHOLD:10000}
    backpressure-sample-interval-millis: ${SMART_TICKET_RATE_LIMIT_BACKPRESSURE_SAMPLE_INTERVAL_MILLIS:1000}
  payment:
    mock-callback-secret: ${SMART_TICKET_PAYMENT_MOCK_CALLBACK_SECRET:smart-ticket-mock-payment-secret-at-least-32-bytes}
    callback-timestamp-tolerance-seconds: ${SMART_TICKET_PAYMENT_CALLBACK_TIMESTAMP_TOLERANCE_SECONDS:300}
    callback-nonce-ttl-seconds: ${SMART_TICKET_PAYMENT_CALLBACK_NONCE_TTL_SECONDS:600}
